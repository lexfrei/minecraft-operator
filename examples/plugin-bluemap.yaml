apiVersion: mc.k8s.lex.la/v1beta1
kind: Plugin
metadata:
  name: bluemap
  namespace: default
spec:
  # Plugin source from Hangar (PaperMC plugin repository)
  source:
    type: hangar
    project: "BlueMap"

  # Use latest compatible version
  updateStrategy: latest

  # Wait 7 days before applying new plugin versions
  # This allows community to report issues with new releases
  updateDelay: 168h

  # BlueMap exposes a web map UI on port 8100
  endpoints:
    - name: web-ui
      port: 8100
      protocol: HTTP

  # Plugin directory name (must match plugin.yml "name" field)
  # Required when configs are specified
  pluginDirName: BlueMap

  # Default config files for this plugin
  # These are copied to plugins/BlueMap/ on all matched servers
  # Servers can override specific files via spec.pluginConfigs
  configs:
    - configMapRef:
        name: bluemap-defaults
        key: core.conf
      path: core.conf
      overwrite: always

  # Apply this plugin to all servers with label "type: vanilla"
  instanceSelector:
    matchLabels:
      type: vanilla
