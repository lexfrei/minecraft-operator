version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - funlen
    - ginkgolinter
    - goconst
    - gocyclo
    - godot
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      # The `inline` analyzer (default-enabled since golangci-lint v2.12)
      # only reports "cannot inline: type parameter inference is not yet
      # supported" — a Go compiler limitation on generics, not a code
      # defect, and nothing the source can act on. Disable just that
      # analyzer; the rest of govet stays on.
      disable:
        - inline
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
